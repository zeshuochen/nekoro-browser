<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="nekoro-browser social preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151a2e"/>
      <stop offset="55%" stop-color="#0f1220"/>
      <stop offset="100%" stop-color="#0b0e19"/>
    </linearGradient>
    <clipPath id="markClip">
      <rect x="96" y="88" width="128" height="128" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1150" cy="80" r="220" fill="#3b82f6" opacity="0.07"/>
  <circle cx="120" cy="600" r="180" fill="#f472b6" opacity="0.05"/>

  <!-- logo mark -->
  <g clip-path="url(#markClip)">
    <rect x="96" y="88" width="128" height="128" fill="#1a1a2e"/>
    <g transform="translate(96,88) scale(0.25)">
      <polygon points="80,180 160,40 200,160" fill="#3b82f6" opacity="0.9"/>
      <polygon points="312,160 352,40 432,180" fill="#3b82f6" opacity="0.9"/>
      <polygon points="110,170 160,80 185,165" fill="#1a1a2e"/>
      <polygon points="327,165 352,80 402,170" fill="#1a1a2e"/>
      <rect x="120" y="140" width="272" height="260" rx="20" fill="#16213e" stroke="#3b82f6" stroke-width="10"/>
      <circle cx="150" cy="175" r="10" fill="#ef4444"/>
      <circle cx="180" cy="175" r="10" fill="#f59e0b"/>
      <circle cx="210" cy="175" r="10" fill="#22c55e"/>
      <text x="150" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="76" font-weight="bold" fill="#3b82f6">&gt;_</text>
      <polygon points="245,378 256,395 267,378" fill="#f472b6"/>
    </g>
  </g>

  <text x="256" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="60" font-weight="700" fill="#e8ecf8">nekoro-browser</text>
  <text x="258" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8">Browser automation CLI + MCP server</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="31" fill="#cbd5e1">
    <text x="96" y="292">Drives the Chrome you already use —</text>
    <text x="96" y="336">no debug port, no automation banner,</text>
    <text x="96" y="380">no fresh profile.</text>
  </g>

  <!-- pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="22">
    <rect x="96" y="424" width="196" height="48" rx="24" fill="#1b2440" stroke="#2f3b5e" stroke-width="2"/>
    <text x="194" y="455" fill="#93b4f5" text-anchor="middle">47 CDP helpers</text>

    <rect x="308" y="424" width="180" height="48" rx="24" fill="#1b2440" stroke="#2f3b5e" stroke-width="2"/>
    <text x="398" y="455" fill="#93b4f5" text-anchor="middle">46 MCP tools</text>

    <rect x="504" y="424" width="140" height="48" rx="24" fill="#1b2440" stroke="#2f3b5e" stroke-width="2"/>
    <text x="574" y="455" fill="#93b4f5" text-anchor="middle">zero deps</text>
  </g>

  <!-- terminal card -->
  <g>
    <rect x="800" y="264" width="392" height="216" rx="18" fill="#0b0e19" stroke="#2a3350" stroke-width="2"/>
    <circle cx="828" cy="292" r="7" fill="#ef4444"/>
    <circle cx="852" cy="292" r="7" fill="#f59e0b"/>
    <circle cx="876" cy="292" r="7" fill="#22c55e"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
      <text x="824" y="348" fill="#3b82f6">$</text>
      <text x="844" y="348" fill="#cbd5e1">uv tool install nekoro-browser</text>
      <text x="824" y="386" fill="#3b82f6">$</text>
      <text x="844" y="386" fill="#cbd5e1">nekoro-browser setup</text>
      <text x="824" y="424" fill="#3b82f6">$</text>
      <text x="844" y="424" fill="#94a3b8">echo "page_info()" |</text>
      <text x="844" y="450" fill="#94a3b8">nekoro-browser</text>
    </g>
  </g>

  <text x="96" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#64748b">github.com/zeshuochen/nekoro-browser</text>
</svg>
