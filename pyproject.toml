[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nekoro-browser"
version = "0.3.1"
description = "Lightweight browser automation CLI + MCP server driving your everyday Chrome via the extension chrome.debugger API — keeps your login state, no --remote-debugging-port"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = []
keywords = [
    "browser-automation", "chrome", "cdp", "chrome-devtools-protocol",
    "mcp", "model-context-protocol", "agent", "llm", "playwright-alternative",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    # Windows 是主力开发/实测平台；POSIX 分支有代码（XDG 目录、chmod 600、
    # OpenProcess vs os.kill 分平台探活）且由 CI 的 ubuntu job 覆盖单测，
    # 但没在真机 macOS/Linux + Chrome 上跑过全链路 —— 见 README「平台支持」。
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.urls]
Homepage = "https://github.com/zeshuochen/nekoro-browser"
Repository = "https://github.com/zeshuochen/nekoro-browser"
Issues = "https://github.com/zeshuochen/nekoro-browser/issues"
Documentation = "https://github.com/zeshuochen/nekoro-browser/blob/master/SKILL.md"

[project.scripts]
nekoro-browser = "nekoro_browser.cli:main"
nekoro-browser-mcp = "nekoro_browser.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nekoro_browser"]

# 从 PyPI 装的人拿不到 git 仓库，但没有 extension/ 就没法加载扩展 = 装了也用不了。
# 把扩展和 domain-skills 塞进 wheel，`nekoro-browser --extension-path` 打印落地路径。
# SKILL.md 是使用手册：pip 装的 agent 本地就能读到，不必跳 GitHub 在线文档。
[tool.hatch.build.targets.wheel.force-include]
"extension" = "nekoro_browser/extension"
"domain-skills" = "nekoro_browser/domain-skills"
"SKILL.md" = "nekoro_browser/SKILL.md"

[tool.hatch.build.targets.sdist]
# 扩展和 domain-skills 不是 Python 包，但没有扩展这工具没法用，
# sdist 里必须带上，否则 `pip download` 拿到的是半个东西。
include = [
    "src/nekoro_browser",
    "extension",
    "domain-skills",
    "tests",
    "README.md",
    "README.zh-CN.md",
    "SKILL.md",
    "AGENTS.md",
    "LICENSE",
]

[tool.pyright]
# standard 而不是 strict：helpers.py 是 CDP 的薄封装，收到的就是动态 JSON，
# daemon/bridge 这条链上的参数天然是鸭子类型（真 Daemon、测试 fake、站点脚本都往里塞）。
# strict 会把这些全判成 error（实测 2211 条，九成是 reportUnknown* 的级联），
# 要归零就得给整条 CDP 链写 TypedDict——那正是这个项目刻意不做的事。
# 与其挂一个谁也过不了的标准，不如挂一个 CI 真能守住的：standard 零 error。
# 注：编辑器里的 basedpyright 把这些算 warning、pyright CLI 算 error，口径不同，
# 以 CI 里的 pyright CLI 为准（.github/workflows/tests.yml 的 typecheck job）。
typeCheckingMode = "standard"
include = ["src", "tests"]
extraPaths = ["src"]
