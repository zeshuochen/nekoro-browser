name: publish

# 手动触发，不跟 push/tag 挂钩——发版是人来决定的动作，不该被一次误推带上 PyPI。
# 前置（一次性，两个目标各配一次——TestPyPI 与 PyPI 是完全独立的账号体系）：
#   PyPI     https://pypi.org/manage/account/publishing/      → workflow: publish.yml, environment: pypi
#   TestPyPI https://test.pypi.org/manage/account/publishing/ → workflow: publish.yml, environment: testpypi
# 没配就触发会以 invalid-publisher 失败。默认目标是 testpypi，但本项目直接发了
# pypi——产物已在干净 venv 里验证过（wheel 装上、两个 entry point 可跑、扩展在包内），
# TestPyPI 那一轮的边际价值不抵再开一套账号 + 2FA 的成本。
# 用 Trusted Publishing 是为了不在仓库里存 API token。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "发到哪里"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write          # Trusted Publishing 用 OIDC，无需密钥
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests before publishing
        # 发出去的版本撤不回来（PyPI 不允许重传同一版本号），发布前必须过一遍测试
        run: |
          python -m pip install -e .
          for f in tests/test_*.py; do python "$f" || exit 1; done
      - run: python -m pip install build
      - run: python -m build
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
