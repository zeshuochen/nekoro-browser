name: publish

# 手动触发，不跟 push/tag 挂钩——发版是人来决定的动作，不该被一次误推带上 PyPI。
# 前置（一次性）：在 https://pypi.org/manage/account/publishing/ 给这个仓库配
# Trusted Publisher（workflow 填 publish.yml，environment 填 pypi），
# 这样不用在仓库里存 API token。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "发到哪里"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write          # Trusted Publishing 用 OIDC，无需密钥
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
